name: ISO build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Build ISO
        run: nix build .#iso --print-build-logs
      - name: Publish ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: laptop-inspection-iso
          path: result/iso/*.iso
          if-no-files-found: error
          retention-days: 7
